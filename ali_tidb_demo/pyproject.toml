[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tidb-bailian-agent-demo"
version = "0.1.0"
description = "TiDB Cloud Starter and Alibaba Cloud Model Studio Agent demo"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.10,<2",
  "openai>=1.0,<3",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tidb-agent-mcp = "agent_demo.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
